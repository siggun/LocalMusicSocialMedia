services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: lyra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyra
      POSTGRES_USER: lyra
      POSTGRES_PASSWORD: lyra
    ports:
      - "5432:5432"
    volumes:
      - lyra-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyra -d lyra"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lyra-pgdata:
