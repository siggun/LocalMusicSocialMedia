services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: bandswipe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bandswipe
      POSTGRES_USER: bandswipe
      POSTGRES_PASSWORD: bandswipe
    ports:
      - "5432:5432"
    volumes:
      - bandswipe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandswipe -d bandswipe"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bandswipe-pgdata:
